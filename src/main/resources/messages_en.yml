language-name: English
# Shown in place of {prefix}. Colour codes use the '&' format; MiniMessage tags work on Paper, Purpur and Folia.
prefix: "&8[&6DyMarket&8]"
value:
  language-auto: "Auto"
  language-en: "English"
  language-tr: "Turkish"
  language-de: "German"
  language-es: "Spanish"
  language-ru: "Russian"
  module-auction: "auction house"
  module-estate: "estate"
general:
  no-permission: "{prefix} &cYou do not have permission to do that."
  player-only: "{prefix} &cOnly players can use this command."
  unknown-command: "{prefix} &cUnknown command. Use &f/dymarket help&c."
  invalid-language: "{prefix} &cAvailable languages: &fauto&7, &fen&7, &ftr&7, &fde&7, &fes&7, &fru&c."
  language-changed: "{prefix} &aYour language is now &f{language}&a."
  server-language-changed: "{prefix} &aThe server language mode is now &f{language}&a."
  player-not-found: "{prefix} &cNo player named &f{player}&c was found."
  reload: "{prefix} &aSettings and messages reloaded."
  reload-failed: "{prefix} &cReload failed. The previous settings are kept; check the console."
  invalid-amount: "{prefix} &f{amount} &cis not a valid amount."
  unknown-currency: "{prefix} &cUnknown currency &f{currency}&c. Available: &f{currencies}&c."
  invalid-page: "{prefix} &cThat page does not exist. Pages: &f{pages}&c."
  module-not-loaded: "{prefix} &cThe {module} module is not loaded on this server."
  feature-disabled: "{prefix} &cThis feature is turned off on this server."
  rate-limited: "{prefix} &cYou are doing that too fast. Wait a moment and try again."
  storage-error: "{prefix} &cThe data storage did not answer; nothing was changed. Please tell a staff member."
balance:
  usage: "{prefix} &7Usage: &f/balance <player> [currency]"
  self: "{prefix} &7Your {currency}: &a{balance}"
  other: "{prefix} &f{player}&7's {currency}: &a{balance}"
  header-self: "{prefix} &7Your balances:"
  header-other: "{prefix} &7Balances of &f{player}&7:"
  line: "&8 - &7{currency}: &a{balance}"
economy:
  insufficient-funds: "{prefix} &cNot enough {currency}. Balance: &f{balance}&c."
  max-balance: "{prefix} &cThat would go above the maximum balance of &f{max}&c."
  not-transferable: "{prefix} &f{currency} &ccannot be sent to other players."
  cancelled: "{prefix} &cAnother plugin cancelled this transaction."
pay:
  usage: "{prefix} &7Usage: &f/pay <player> <amount> [currency]"
  self: "{prefix} &cYou cannot pay yourself."
  below-min: "{prefix} &cThe smallest payment is &f{min}&c."
  confirm: "{prefix} &eSend &f{amount}&e to &f{player}&e? Type &f{command} &eto confirm."
  sent: "{prefix} &aYou sent &f{amount}&a to &f{player}&a. Balance: &f{balance}&a."
  received: "{prefix} &aYou received &f{amount}&a from &f{player}&a."
baltop:
  header: "{prefix} &6Richest players &7({currency}) &8- page {page}/{pages}"
  line: "&7{rank}. &f{player} &8- &a{balance}"
  own: "&7Your balance: &a{balance}"
  next: "&7Next page: &f{command}"
  empty: "{prefix} &7Nobody has any {currency} yet."
credits:
  disabled: "{prefix} &cCredits are not enabled on this server."
  usage: "{prefix} &7Usage: &f/credits&7, &f/credits send <player> <amount>&7, &f/credits exchange <amount>"
  balance: "{prefix} &7Your credits: &b{balance}"
  send-usage: "{prefix} &7Usage: &f/credits send <player> <amount>"
  sent: "{prefix} &aYou sent &f{amount}&a to &f{player}&a."
  received: "{prefix} &aYou received &f{amount}&a from &f{player}&a."
  exchange-disabled: "{prefix} &cExchanging credits is turned off on this server."
  exchange-usage: "{prefix} &7Usage: &f/credits exchange <amount> &8- &7rate: &f{credit} &7= &a{money}"
  exchange-min: "{prefix} &cThe smallest exchange is &f{min}&c."
  exchanged: "{prefix} &aYou exchanged &f{credits}&a for &f{money}&a. Balance: &f{balance}&a."
  topup-received: "{prefix} &aYour top-up of &f{amount}&a has arrived. Thank you!"
  bonus-received: "{prefix} &aBonus: &f{amount}&a extra."
  topup-announce: "{prefix} &f{player} &7topped up &b{amount}&7. Thank you for supporting the server!"
admin:
  give-usage: "{prefix} &7Usage: &f/dymarket give <player> <amount> [currency] [txid]"
  take-usage: "{prefix} &7Usage: &f/dymarket take <player> <amount> [currency]"
  set-usage: "{prefix} &7Usage: &f/dymarket set <player> <amount> [currency]"
  invalid-txid: "{prefix} &f{txid} &cis not a valid transaction id (letters, digits, _ . : - up to 128)."
