language-name: English
# English messages. Keep keys and {placeholders} unchanged; & codes set colours (MiniMessage tags also work on Paper, Purpur and Folia).
# Edit quoted text, then use /dyma reload. Missing keys use bundled defaults.
# Unchanged texts from older DyMarket versions are upgraded automatically; your own edits are kept.
# Shown in place of {prefix}.
prefix: "&7[&cDyMarket&7]"
value:
  language-auto: "Auto"
  language-en: "English"
  language-tr: "Turkish"
  language-de: "German"
  language-es: "Spanish"
  language-ru: "Russian"
  module-auction: "auction house"
  module-estate: "estate"
  second: "{n} second"
  seconds: "{n} seconds"
  minute: "{n} minute"
  minutes: "{n} minutes"
general:
  no-permission: "{prefix} &cYou don't have permission to do that."
  player-only: "{prefix} &cOnly players can use this command."
  unknown-command: "{prefix} &cUnknown command. Type &e/market help &cto see all commands."
  unknown-subcommand: "{prefix} &cThere's no option called &e{word}&c."
  invalid-language: "{prefix} &cThat language isn't available. Pick one of: &eauto&c, &een&c, &etr&c, &ede&c, &ees&c, &eru&c."
  language-usage: "{prefix} &cUsage: &e/market language <auto|en|tr|de|es|ru>"
  language-changed: "{prefix} &aYour language is now &e{language}&a."
  server-language-changed: "{prefix} &aThe language for everyone is now &e{language}&a."
  player-not-found: "{prefix} &cCouldn't find a player called &e{player}&c."
  reload: "{prefix} &aSettings and messages reloaded."
  reload-failed: "{prefix} &cThe new settings have errors, so the old ones are still in use. Check the console."
  invalid-amount: "{prefix} &e{amount} &cisn't a valid amount."
  unknown-currency: "{prefix} &cThere's no currency called &e{currency}&c. You can use: &e{currencies}&c."
  invalid-page: "{prefix} &cThat page doesn't exist. Pages: &e{pages}&c."
  module-not-loaded: "{prefix} &cThe {module} isn't turned on on this server."
  feature-disabled: "{prefix} &cThis is turned off on this server."
  rate-limited: "{prefix} &cSlow down a little and try again in a moment."
  cooldown: "{prefix} &cPlease wait &e{time} &cbefore doing that again."
  storage-error: "{prefix} &cSomething went wrong while saving, so nothing was changed. Please tell a staff member."
balance:
  usage: "{prefix} &cUsage: &e/balance <player> [currency]"
  self: "{prefix} &eYour {currency}: &6{balance}"
  other: "{prefix} &e{player}&e's {currency}: &6{balance}"
  header-self: "&7&m----------&r {prefix} &eYour Balance &7&m----------"
  header-other: "&7&m----------&r {prefix} &e{player}&e's Balance &7&m----------"
  line: "&7- &e{currency}: &6{balance}"
economy:
  insufficient-funds: "{prefix} &cYou don't have enough {currency}. You have &e{balance}&c."
  max-balance: "{prefix} &cThat would go over the highest balance allowed (&e{max}&c)."
  not-transferable: "{prefix} &e{currency} &ccan't be sent to other players."
  cancelled: "{prefix} &cAnother plugin stopped this payment."
pay:
  usage: "{prefix} &cUsage: &e/pay <player> <amount> [currency]"
  self: "{prefix} &cYou can't pay yourself."
  below-min: "{prefix} &cThe smallest payment is &e{min}&c."
  confirm: "{prefix} &eSend &6{amount} &eto &f{player}&e? Type &a{command} &eto confirm."
  sent: "{prefix} &aYou sent &6{amount} &ato &e{player}&a. You now have &6{balance}&a."
  received: "{prefix} &aYou got &6{amount} &afrom &e{player}&a."
baltop:
  header: "&7&m----------&r {prefix} &eRichest Players &7({currency}, {page}/{pages}) &7&m----------"
  line: "&7{rank}. &e{player} &7- &6{balance}"
  own: "&eYou: &6{balance}"
  next: "&7Next page: &e{command}"
  empty: "{prefix} &eNobody has any {currency} yet."
credits:
  disabled: "{prefix} &cCredits aren't turned on on this server."
  usage: "{prefix} &cUsage: &e/credits &7| &e/credits send <player> <amount> &7| &e/credits exchange <amount>"
  balance: "{prefix} &eYour credits: &b{balance}"
  send-usage: "{prefix} &cUsage: &e/credits send <player> <amount>"
  sent: "{prefix} &aYou sent &b{amount} &ato &e{player}&a."
  received: "{prefix} &aYou got &b{amount} &afrom &e{player}&a."
  exchange-disabled: "{prefix} &cExchanging credits is turned off on this server."
  exchange-usage: "{prefix} &cUsage: &e/credits exchange <amount> &7(&b{credit} &7= &6{money}&7)"
  exchange-help: "{prefix} &cUsage: &e/credits exchange <amount>"
  exchange-min: "{prefix} &cYou can exchange at least &e{min}&c."
  exchanged: "{prefix} &aYou turned &b{credits} &ainto &6{money}&a. You now have &6{balance}&a."
  topup-received: "{prefix} &aYour &b{amount} &ahave arrived. Thank you for your support!"
  bonus-received: "{prefix} &aBonus: &b{amount} &aextra!"
  topup-announce: "{prefix} &e{player} &ajust bought &b{amount}&a. Thank you for supporting the server!"
admin:
  unknown: "{prefix} &cUnknown admin command. Type &e{command} &cto see them all."
  language-usage: "{prefix} &cUsage: &e/dyma language <auto|en|tr|de|es|ru>"
  give-usage: "{prefix} &cUsage: &e/dyma give <player> <amount> [currency] [txid]"
  take-usage: "{prefix} &cUsage: &e/dyma take <player> <amount> [currency]"
  set-usage: "{prefix} &cUsage: &e/dyma set <player> <amount> [currency]"
  reset-usage: "{prefix} &cUsage: &e/dyma reset <player> [currency]"
  amount-missing: "{prefix} &cHow much {currency}? Type the amount too."
  invalid-txid: "{prefix} &e{txid} &cisn't a valid transaction id. Use letters, digits and _ . : - (up to 128)."
  given: "{prefix} &aGave &6{amount} &ato &e{player}&a. They now have &6{balance}&a. &7(#{id})"
  given-bonus: "{prefix} &aGave &6{amount} &aand a &6{bonus} &abonus to &e{player}&a. They now have &6{balance}&a. &7(#{id})"
  already-applied: "{prefix} &eTransaction &f{txid} &ewas already delivered, so nothing changed."
  taken: "{prefix} &aTook &6{amount} &afrom &e{player}&a. They now have &6{balance}&a. &7(#{id})"
  set: "{prefix} &aSet &e{player}&a's {currency} to &6{balance}&a."
  reset: "{prefix} &aReset &e{player}&a's {currency} to &6{balance}&a."
  log-usage: "{prefix} &cUsage: &e/dyma log <player> [page]"
  log-header: "&7&m----------&r {prefix} &e{player}&e's History &7({page}/{pages}) &7&m----------"
  log-line: "&7{time} &e#{id} &f{kind} &6{sign}{amount} &7{other} {note}{reversed}"
  log-reversed: " &c(undone by #{id})"
  log-empty: "{prefix} &e{player} &ehas no transactions yet."
  rollback-usage: "{prefix} &cUsage: &e/dyma rollback <id> [force]"
  rollback-done: "{prefix} &aUndid transaction &e#{id} &a(&6{amount}&a) with &e#{reversal}&a."
  rollback-not-found: "{prefix} &cThere's no transaction &e#{id}&c."
  rollback-already: "{prefix} &cTransaction &e#{id} &cwas already undone."
  rollback-negative: "{prefix} &cUndoing &e#{id} &cwould leave someone below zero. Add &eforce &cto take only what they have."
  merge-usage: "{prefix} &cUsage: &e/dyma merge <from> <to>"
  merge-same: "{prefix} &cPick two different players."
  merge-done: "{prefix} &aMoved everything from &e{from} &ato &e{to}&a: {count} balances, plus listings and leases."
  import-usage: "{prefix} &cUsage: &e/dyma import <essentials|vault>"
  import-external: "{prefix} &cYour money is kept by another economy plugin (provider: vault), so there's nothing to import."
  import-no-vault: "{prefix} &cThere's no other economy plugin to import from."
  import-not-found: "{prefix} &cEssentials data wasn't found at &e{path}&c."
  import-running: "{prefix} &cAn import is already running."
  import-started: "{prefix} &eImport started. You can follow it in the console."
  import-done: "{prefix} &aImport done: &e{imported} &aimported, &e{kept} &akept (they already had money), &e{skipped} &askipped."
  import-failed: "{prefix} &cThe import failed. Check the console."
alerts:
  transfer: "{prefix} &c[Alert] &e{from} &7sent &6{amount} &7to &e{to} &7({kind}, #{id})"
updates:
  available: "{prefix} &eA new DyMarket version is out: &6{latest} &7(you have {current})&e. Download: &b{url}"
