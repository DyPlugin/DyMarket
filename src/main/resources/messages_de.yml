language-name: Deutsch
# Deutsche Nachrichten. Schlüssel und {Platzhalter} nicht ändern; &-Codes setzen Farben (MiniMessage-Tags funktionieren auch auf Paper, Purpur und Folia).
# Bearbeite den Text in Anführungszeichen und nutze danach /dyma reload. Fehlende Schlüssel nutzen die mitgelieferten Standardtexte.
# Unveränderte Texte älterer DyMarket-Versionen werden automatisch aktualisiert; deine eigenen Änderungen bleiben erhalten.
# Wird anstelle von {prefix} angezeigt.
