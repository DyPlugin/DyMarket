  log-header: "{prefix} &7Transactions of &f{player} &8- page {page}/{pages}"
  log-line: "&8{time} &7#{id} &f{kind} &a{sign}{amount} &7{other} &8{note}{reversed}"
  log-reversed: " &c(reversed by #{id})"
  log-empty: "{prefix} &7No transactions for &f{player}&7."
  rollback-usage: "{prefix} &7Usage: &f/dymarket rollback <id> [force]"
