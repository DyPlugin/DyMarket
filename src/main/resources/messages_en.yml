  rollback-not-found: "{prefix} &cNo transaction &f#{id}&c."
  rollback-already: "{prefix} &cTransaction &f#{id}&c was already reversed."
  rollback-negative: "{prefix} &cReversing &f#{id}&c would make a balance negative. Add &fforce&c to take only what is there."
  merge-usage: "{prefix} &7Usage: &f/dymarket merge <from> <to>"
  merge-same: "{prefix} &cChoose two different players."
  merge-done: "{prefix} &aMerged &f{from}&a into &f{to}&a ({count} balances moved, listings and leases moved)."
  import-usage: "{prefix} &7Usage: &f/dymarket import <essentials|vault>"
