language:
  # auto: saved player choice, then the player's Minecraft language, then English.
  # Any other value is used for all players and the console.
  default: auto            # auto | en | tr | de | es | ru

storage:
  type: sqlite             # sqlite only in this version
  file: data.db
  # How often changed balances and new transactions are written to disk (20 ticks = 1 second).
  flush-interval-ticks: 20

# Each key is a currency id. Amounts are stored exactly with the given number of decimals (0-8).
currencies:
  money:
    enabled: true
    name: Money
    plural: Money
    symbol: "$"
    symbol-after: false
    decimals: 2
    format-locale: en-US   # grouping/decimal separators; tr-TR gives 1.250,50
    starting-balance: 100.0
    max-balance: 1000000000.0
    transferable: true
    vault: true            # exactly one currency may be the Vault currency
    provider: internal     # internal | vault  (vault = use another economy plugin for this currency)
  credits:
    enabled: true
    name: Credit
    plural: Credits
    symbol: "C"
    symbol-after: true
    decimals: 0
    format-locale: en-US
    starting-balance: 0
    max-balance: 100000000
    transferable: true
    vault: false

credits:
  exchange:
    # /credits exchange <amount> turns credits into the Vault currency.
    enabled: true
    rate: 1000.0           # money received per 1 credit
    min: 1
  topup-bonus-percent: 0   # extra credits added on /dymarket give ... credits with a txid
  # Tell everyone online when a web top-up arrives.
  announce-topups: false

pay:
  enabled: true
  min-amount: 0.01
  confirm-above: 0         # 0 = never ask

security:
  rate-limit:
    # Actions per player per minute; 0 = no limit. dymarket.bypass.ratelimit skips it.
    pay-per-minute: 10
    ah-buy-per-minute: 20
  alert:
    # Transfers of at least this amount (in the transfer's currency) are reported to staff.
    enabled: true
    transfer-above: 100000.0
    notify-permission: dymarket.admin.alerts
    discord: true          # through DyDiscord when available

baltop:
  page-size: 10
  refresh-seconds: 60
  # Players with this permission are left out of /baltop.
  exclude-permission: dymarket.baltop.hidden

auction:
  enabled: true
  currency: money          # default listing currency; players may pick another listed here
  allowed-currencies: [money, credits]
  duration-hours: 48
  tax-percent: 5.0
  min-price: 1.0
  max-price: 100000000.0
  max-listings: 7          # 0 = no limit; overridden by dymarket.ah.limit.<n>
  confirm-purchase: true
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, STRUCTURE_BLOCK, DEBUG_STICK, KNOWLEDGE_BOOK]
  block-items-with-lore-containing: []
  broadcast-sales: false
  gui:
    rows: 6
    sort: newest           # newest | price-asc | price-desc

estate:
  # Needs DyClaim 1.3.1 or newer; without it the estate module turns itself off.
  enabled: true
  currency: money
  allowed-currencies: [money, credits]
  max-chunks-per-listing: 64
  tax-percent: 5.0
  sale:
    enabled: true
    min-price: 1.0
    max-price: 1000000000.0
  rent:
    enabled: true
    min-days: 1
    max-days: 90
    rights: [build, containers, doors, trapdoors, redstone, entities, teleport]
    grace-hours: 24
    refund-on-owner-cancel-percent: 100
    check-interval-minutes: 10
  listing-expires-days: 30

import:
  # Folder read by /dymarket import essentials, relative to the server folder.
  essentials-userdata: plugins/Essentials/userdata

updates:
  # Check Modrinth for a new DyMarket version every 6 hours and tell admins.
  check: true

metrics:
  # Anonymous usage statistics on bStats.
  enabled: true
