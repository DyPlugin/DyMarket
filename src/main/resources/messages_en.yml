  ah-search: "&6/ah search [text] &7- Find an item in the auction house"
  ah-collect: "&6/ah collect &7- Take back your returned and unsold items"
  estate: "&6/estate &7- Browse claims for sale and for rent"
  estate-sell: "&6/estate sell <price> &7- Sell the claim you're standing in"
  estate-rent: "&6/estate rent <price> <days> &7- Rent out the claim you're standing in"
