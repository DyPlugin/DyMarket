  import-no-vault: "{prefix} &cNo other Vault economy is registered to import from."
  import-not-found: "{prefix} &cEssentials data was not found at &f{path}&c."
  import-running: "{prefix} &cAn import is already running."
  import-started: "{prefix} &7Import started; progress is shown in the console."
  import-done: "{prefix} &aImport finished: &f{imported}&a imported, &f{kept}&a kept (already had money), &f{skipped}&a skipped."
  import-failed: "{prefix} &cThe import failed; check the console."
alerts:
  transfer: "{prefix} &c[Alert] &f{from} &7-> &f{to}&7: &f{amount} &8({kind}, #{id})"
updates:
  available: "{prefix} &eDyMarket {latest} is available (you have {current}): &f{url}"
help:
  header:
    - "&8&m----------&r &6DyMarket &fHelp &8&m----------"
  balance:
    - "&6/balance [currency] &7- Show your balance"
  balance-others:
    - "&6/balance <player> [currency] &7- Show a player's balance"
  pay:
    - "&6/pay <player> <amount> [currency] &7- Send money to a player"
  baltop:
    - "&6/baltop [currency] [page] &7- Show the richest players"
  credits:
    - "&6/credits &7- Show your credits"
  credits-send:
    - "&6/credits send <player> <amount> &7- Send credits to a player"
  credits-exchange:
    - "&6/credits exchange <amount> &7- Exchange credits for money"
  auction:
    - "&6/ah &7- Open the auction house"
    - "&6/ah list [page] &7, &6/ah search <text> &7, &6/ah info <id> &7- Browse listings"
    - "&6/ah buy <id> &7- Buy a listing"
    - "&6/ah collect &7- Take items from your collection box"
  auction-sell:
    - "&6/ah sell <price> [currency] [amount] &7- Sell the item in your hand"
    - "&6/ah mine &7, &6/ah cancel <id> &7- Manage your listings"
  estate:
    - "&6/estate list [page] &7, &6/estate info [id] &7- Browse claims for sale and rent"
    - "&6/estate buy [id] &7, &6/estate lease [id] &7- Buy or rent a claim"
    - "&6/estate autorenew &7, &6/estate leave &7- Manage your lease"
  estate-sell:
    - "&6/estate sell <price> [currency] &7- Sell the claim you stand in"
    - "&6/estate unlist &7, &6/estate mine &7- Manage your listings"
  estate-rent:
    - "&6/estate rent <price> <days> [currency] &7- Rent out the claim you stand in"
    - "&6/estate evict &7- End a lease when its period is over"
  language:
    - "&6/dymarket language <auto|en|tr|de|es|ru> &7- Change your language"
  admin:
    - "&8&m----------&r &6DyMarket &fAdmin &8&m----------"
    - "&6/dymarket reload &7- Reload settings and messages"
  admin-economy:
    - "&6/dymarket give <player> <amount> [currency] [txid] &7- Give money (txid: deliver once)"
    - "&6/dymarket take <player> <amount> [currency] &7- Take money"
    - "&6/dymarket set <player> <amount> [currency] &7- Set a balance"
    - "&6/dymarket log <player> [page] &7- Show a player's transactions"
    - "&6/dymarket rollback <id> [force] &7- Reverse a transaction"
    - "&6/dymarket merge <from> <to> &7- Merge two accounts"
    - "&6/dymarket import <essentials|vault> &7- Import balances"
  admin-auction:
    - "&6/dymarket ah remove <id> &7- Remove a listing"
    - "&6/dymarket ah purge <player> &7- Remove all of a player's listings"
  admin-estate:
    - "&6/dymarket estate unlist <id> &7- Remove an estate listing"
