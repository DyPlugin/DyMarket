language-name: "Русский"
# Русские сообщения. Ключи и {плейсхолдеры} не меняй; коды & задают цвета (теги MiniMessage тоже работают на Paper, Purpur и Folia).
# Правь текст в кавычках, потом введи /dyma reload. Недостающие ключи берутся из встроенных значений.
# Неизменённые тексты из старых версий DyMarket обновляются сами; твои правки сохраняются.
# Подставляется вместо {prefix}.
prefix: "&7[&cDyMarket&7]"
value:
  language-auto: "Авто"
  language-en: "Английский"
  language-tr: "Турецкий"
  language-de: "Немецкий"
  language-es: "Испанский"
  language-ru: "Русский"
  module-auction: "аукцион"
  module-estate: "недвижимость"
  second: "{n} сек."
  seconds: "{n} сек."
  minute: "{n} мин."
  minutes: "{n} мин."
